name: QC1 portability
on:
  workflow_dispatch:
  pull_request:
    paths: ["qc1-vscode/**", ".github/workflows/qc1-portability.yml"]
  push:
    paths: ["qc1-vscode/**", ".github/workflows/qc1-portability.yml"]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qc1-vscode
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qc1-vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit
      - run: npx --no-install vsce package --out qc1-portability-review.vsix
